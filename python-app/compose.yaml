services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sre-python-api:v1
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sre_lab
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
